name: smolvla_libero
kind: smolvla
endpoint: lerobot/smolvla_libero
load_params:
  device: auto
policy:
  kind: smolvla
  instruction: pick up the red cube and place it on the green target
  cameras: [camera1, camera2, camera3]
  quantize: none  # int8 for 6GB VRAM-safe: ~1GB -> 0.6GB via bitsandbytes
  headless: false