name: franka
# Legacy uniform limits — kept for A/B comparisons and tests (file is
# franka_uniform.yaml but robot name stays "franka" so it validates
# against physical-ai.yaml environment.robot_name).
# Operation should use franka.yaml (per-joint) instead.
mjcf_path: ../../assets/menagerie/franka_emika_panda/panda_vel.xml

safety:
  max_velocity: 1.0      # rad/s per joint (uniform)
  max_force: 20.0        # Nm per joint (uniform)
  max_effort_action: 1.0
  reject_nan_actions: true
  action_clamp: reject
  recovery_steps: 50
  recovery_mode: resume
