[project]
name = "aegis"
version = "0.1.0"
description = "Physical AI harness (POC): safety-gated policy evaluation in MuJoCo"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    # Floor 0.16: first generation with Click 8.2+ support. Older typer crashes
    # on --help (rich rendering: Parameter.make_metavar() missing 'ctx')
    # when paired with click>=8.2. Lockfile resolves 0.27.1; keep floor here
    # so plain `pip install` users can't land on the broken combination.
    "typer>=0.16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mujoco>=3.0",
    "huggingface-hub>=1.27.0",
    "safetensors>=0.8.0",
    "lerobot>=0.3.3",
    "transformers>=5.15.0",
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.11.0%2Bcu128-cp312-cp312-win_amd64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu128/torchvision-0.26.0%2Bcu128-cp312-cp312-win_amd64.whl",
    "num2words>=0.5.14",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aegis = "aegis.cli:app"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
